# Scare Force settings. Pin numbers are BCM (GPIO numbers), not physical pin numbers.

camera:
  width: 640
  height: 480
  # Arducam Multi Camera Adapter V2.2 (`dtoverlay=camera-mux-4port,cam0-imx708,cam2-imx708` in
  # /boot/firmware/config.txt; camN = port A, B, C, D, here A and C): `rpicam-hello --list-cameras`
  # numbers the cameras it finds 0, 1, ...
  # The Pi 4 has one CSI port, so only one streams at a time; cameras not found are skipped.
  ids: [0, 1]
  dwell_seconds: 2.0        # watch each camera this long, then switch (a switch takes ~0.5 s)

detector:
  model: models/toys_320.onnx
  labels: models/toy_labels.txt
  num_threads: 4
  conf_threshold: 0.25      # boxes below this are dropped before NMS
  iou_threshold: 0.45       # NMS overlap threshold

# Original pretrained model: only person detections are used.
person_detector:
  model: models/yolo11n_320.onnx
  labels: models/coco.txt
  num_threads: 4
  conf_threshold: 0.35
  iou_threshold: 0.45
  hold_seconds: 0.5         # retain recent person regions for this camera only
  same_object_iou: 0.5      # reject similar boxes, allow smaller held-animal boxes

light:
  pin: 26                   # GPIO26 = physical pin 37, drives the light's relay
  active_high: true         # false if the relay board switches on when its input is LOW
  # What the light does during a scare. steady = on the whole scare (the original behavior);
  # strobe = on duty/rate_hz, off (1-duty)/rate_hz, repeating; random = strobe with every on and
  # off time varied by +/- jitter (varied timing slows habituation).
  pattern: strobe           # steady | strobe | random
  driver: relay             # relay | mosfet: a relay may not switch faster than relay_min_toggle_s
  rate_hz: 2.0              # flashes per second (strobe/random)
  duty: 0.5                 # fraction of each flash period the light is on, 0 < duty < 1
  jitter: 0.3               # random only: each on/off time scaled by a factor in [1-jitter, 1+jitter]
  # Flashing at 3-60 Hz is a seizure hazard for photosensitive people; staying under 3 Hz protects
  # farm staff and visitors. Raising this is a team decision.
  max_rate_hz: 3.0          # safety ceiling on the fastest flash (random: rate_hz / (1 - jitter))
  relay_min_toggle_s: 0.15  # relay only: shortest allowed on or off time

servos:
  # Hardware PWM: needs `dtoverlay=pwm,pin=19,func=2` in /boot/firmware/config.txt (channel 1 on
  # GPIO19). Both servos always get the same angle, so their signal wires share GPIO19 through a
  # Y cable. GPIO18 is the camera adapter's, and GPIO12/13 read as stuck at ground with the
  # adapter fitted. Miuzei 25 kg 270-degree servos: min_us -> 0 deg, max_us -> range_deg, so the
  # centre is 135 deg.
  min_us: 500
  max_us: 2500
  range_deg: 270
  up_angle: 180             # TODO: tune on the hardware (centre +/- 45 for now)
  down_angle: 90
  channels:
    both: {chip: 0, channel: 1, pin: 19}   # both servo signal wires

sound:
  device: plughw:CARD=Headphones,DEV=0   # 3.5 mm jack, straight to ALSA (fastest start)
  mixer_card: Headphones
  mixer_control: PCM
  level: 80                 # percent, set before every play
  source: library           # library | folder (folder = the original behavior: dir's clips at random)
  library: scare/sounds/library.yaml   # library: the deterrence clip library, stepped through in
                            # order (alternates sound types)
  library_mode: generic     # library: generic | species | auto (species/auto: the label's set)
  dir: sounds               # folder: clips sorted by name; play(n) plays the n-th one

controller:
  labels: [raccoon, groundhog, squirrel]  # only these labels trigger
  min_confidence: 0.5
  scare_seconds: 5          # how long the scare lasts
  flap_seconds: 0.5         # time between servo up and down while scaring
  return_deg_per_s: 90      # after a scare, ease back down this fast: jumping right after an up flap
                            # reverses the servos mid-move, and that current spike can brown out
                            # their supply
  cooldown_seconds: 10      # quiet time after a scare before the next one
