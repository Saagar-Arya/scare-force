# Scare Force settings. Pin numbers are BCM (GPIO numbers), not physical pin numbers.

camera:
  width: 640
  height: 480
  # Arducam Multi Camera Adapter V2.2 (`dtoverlay=camera-mux-4port,cam0-imx708,cam1-imx219,cam2-imx708`
  # in /boot/firmware/config.txt; camN = port A, B, C, D): Camera Module 3s on A and C, the
  # IMX219-160 IR-CUT on B. ids are the numbers `rpicam-hello --list-cameras` shows (not in port
  # order: now 0 = C, 1 = B, 2 = A); the window titles show each camera's port and sensor.
  # The Pi 4 has one CSI port, so only one streams at a time; cameras not found are skipped.
  ids: [0, 1, 2]
  # Sensor mode per model, [width, height]. Unlisted models get libcamera's pick for width x height,
  # which on the imx219 is a 640x480 crop of the sensor's middle (most of the 160-degree lens
  # unused); 1640x1232 is the 2x2-binned full sensor.
  sensor_modes:
    imx219: [1640, 1232]
  dwell_seconds: 5.0        # watch each camera this long, then switch (a switch takes ~0.5 s)
  exposure_value: 1.5       # auto-exposure brightness, in stops (-8..8; 0 = libcamera default,
                            # +1 = twice as bright). Raise if the image is dark, lower if washed out.

detector:
  model: models/person_pest_11n_320.onnx
  labels: models/person_pest_labels.txt
  num_threads: 4
  conf_threshold: 0.25      # boxes below this are dropped before NMS
  iou_threshold: 0.45       # NMS overlap threshold

light:
  # The lamp is switched by a 1-channel relay: on or off only, no dimming. The relay board is
  # powered through the deterrent off switch, so with that switch OFF nothing lights.
  pin: 26                   # GPIO26 = physical pin 37, drives the light's relay
  active_high: true         # false if the relay board switches on when its input is LOW
  # What the light does during a scare. steady = on the whole scare (the original behavior);
  # strobe = on duty/rate_hz, off (1-duty)/rate_hz, repeating; random = strobe with every on and
  # off time varied by +/- jitter (varied timing slows habituation). Checked at startup, before
  # the cameras open.
  pattern: strobe           # steady | strobe | random
  rate_hz: 2.0              # flashes per second (strobe/random)
  duty: 0.5                 # fraction of each flash period the light is on, 0 < duty < 1
  jitter: 0.3               # random only: each on/off time scaled by a factor in [1-jitter, 1+jitter]
  # Flashing at 3-60 Hz is a seizure hazard for photosensitive people; staying under 3 Hz protects
  # farm staff and visitors. Raising this is a team decision.
  max_rate_hz: 3.0          # safety ceiling on the fastest flash (random: rate_hz / (1 - jitter))
  relay_min_toggle_s: 0.15  # shortest allowed relay on or off time; 0.15 is the floor (can only go up)

servos:
  # Hardware PWM: needs `dtoverlay=pwm,pin=19,func=2` in /boot/firmware/config.txt (channel 1 on
  # GPIO19). Both servos always get the same angle, so their signal wires share GPIO19 through a
  # Y cable. GPIO18 is the camera adapter's, and GPIO12/13 read as stuck at ground with the
  # adapter fitted. Miuzei 25 kg 270-degree servos: min_us -> 0 deg, max_us -> range_deg, so the
  # centre is 135 deg.
  min_us: 500
  max_us: 2500
  range_deg: 270
  up_angle: 180             # TODO: tune on the hardware (centre +/- 45 for now)
  down_angle: 90
  channels:
    both: {chip: 0, channel: 1, pin: 19}   # both servo signal wires

sound:
  device: plughw:CARD=Headphones,DEV=0   # 3.5 mm jack, straight to ALSA (fastest start)
  mixer_card: Headphones
  mixer_control: PCM
  level: 88                 # volume, percent (amixer -M), set once at startup. 80 = -1.8 dB,
                            # 88 = +0.7 dB: the loudest without clipping (the loudest dog bark
                            # peaks at -1.1 dBTP); 100 = +4.0 dB clips the barks by ~3 dB. For more,
                            # turn up the amplifier.
  library: scare/sounds/library.yaml   # its generic set: a random clip per scare, never the
                            # one the previous scare played. The species sets are in the repo
                            # but not connected.
  repeat_pause_s: [0.25, 0.6]  # Nov 10: a clip shorter than the scare repeats with a random pause
                            # this long between copies, so it sounds like calling again, not a loop
  mute_idle: true           # mute the mixer between clips: unmute just before each clip, mute
                            # when it ends or is stopped. The Pi 4 jack's own hiss, at the amp's
                            # full gain, is audible otherwise (Nov 9). false = always unmuted
  skip_types: []            # sound types never played, e.g. [human_speech, human_shout,
                            # human_scream] for no human voices. [] = all five generic types
                            # (dog_bark, siren, human_speech, human_shout, human_scream).
  # Every clip is rendered to last the scare (controller.scare_seconds +/- end_window_s):
  # repeated if shorter, ended at the pause nearest scare_seconds rather than mid-bark or
  # mid-word. With no pause in the window (the continuous sirens) it fades out over end_fade_s,
  # ending at scare_seconds.
  end_fade_s: 0.5

controller:
  labels: [pest]            # only pest triggers; person does not trigger or block a pest
  min_confidence: 0.50      # starting threshold; check validation false triggers and recall
  confirm_frames: 3        # require three qualifying frames to reduce one-frame false alarms
  confirm_iou: 0.3          # minimum box overlap to count detections as the same object
  confirmation_gap_seconds: 1.0  # reset stale evidence on return to a camera
  scare_seconds: 5          # how long a scare lasts. Light and sound start together and end
                            # together, when that scare's sound ends; the arms flap that long:
  end_window_s: 1.0         # at its pause nearest scare_seconds, within +/- this: scares last
                            # 4-6 s (Nov 10); a clip already 4-6 s long plays whole. 0 = exactly
                            # scare_seconds
  flap_seconds: 0.5         # time between servo up and down while scaring
  return_deg_per_s: 90      # after a scare, ease back down this fast: jumping right after an up flap
                            # reverses the servos mid-move, and that current spike can brown out
                            # their supply
  cooldown_seconds: 10      # quiet time after a scare before the next one
  cooldown_jitter_s: 3      # Nov 10: each cooldown is cooldown_seconds +/- this, at random (7-13 s):
                            # varied timing slows habituation

log:
  # One CSV row per scare, written when it ends (columns: see scare/activation_log.py).
  # Relative to the repo folder. null = no file, terminal output only.
  activations: logs/activations.csv
  # A photo, an annotated copy and a CSV row per confirmed detection, scare or not (columns and
  # files: see scare/detection_log.py). null = off. Export + report: python -m scare.export
  detections: logs/detections.csv
  photos: logs/photos       # <date>/<id>.jpg and <id>_annotated.jpg
  photo_every_s: 5          # detections that don't fire a scare: at most one per camera this often
  jpeg_quality: 90
  min_free_mb: 500          # below this much free space, photos pause (rows go on)
