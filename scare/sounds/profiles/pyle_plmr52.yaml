# Speaker profile: Pi 4 headphone jack -> Adafruit MAX9744 -> Pyle PLMR52 5.25" marine speaker
# (left channel only). Used by build_sounds.py; output in sounds/build/pyle_plmr52/.
#
# Starting values; the Pyle's response is unmeasured. A new speaker means a new profile and a
# rebuild; originals never change.

sample_rate: 48000      # Hz
channels: 1             # mono; aplay plughw feeds it to the left channel
bit_depth: 16
highpass_hz: 150        # 4th-order Butterworth; keeps rumble out of a 5.25" cone
lowpass_hz: null        # null = no low-pass
target_lufs: -18        # set by build_sounds.py: raptor_coopers_hawk_01 needs the most room
true_peak_dbtp: -1.0    # ceiling; a look-ahead limiter catches only the peaks above it
reference_spl_1m_db: 95 # the amp pot is set in the lab so that a clip at target_lufs with no
                        # level trim measures this at 1 m. 95 dB(A) is the TR4 design point:
                        # <= 100 dB(A) at 1 m (TR4 Test 14), ~85 dB(A) at 3 m (TR4 Test 4).
                        # Every sound type plays at this level (D-21); cited_levels in
                        # library.yaml is documentation only
level_trim_db: {}       # sound_type: dB, lab corrections after the SPL check (lab_check step h
                        # prints the value). Attenuation only (<= 0): a type that measures low
                        # means the pot goes up and the others are trimmed down. Default 0
level_mode: max         # D-24 (Nov 9): each clip as loud as it can go within max_limiter_gr_db
                        # and the true-peak ceiling; none turned down to match. equal = D-21
                        # (every clip at target_lufs). The amp knob is at max; clips set loudness
max_limiter_gr_db: 6.0  # most limiting any unflagged clip may get. A full build sets target_lufs
                        # to the highest integer LUFS where every unflagged clip stays within this
                        # (floor -24), so barks, shouts and hawk calls keep their peaks; the amp
                        # pot makes up the level. A clip over it even at -24 is excluded (too_peaky)
onset_ramp_ms: 1        # anti-click ramp only, never a fade-in
tail_fade_ms: 20
min_s: 1.5              # trailing trim never cuts below this
max_s: 8                # cap per clip (bursts are capped at 10 s per activation anyway)
