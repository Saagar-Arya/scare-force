# Scare Force deterrent sound library (team decision D-17). The single manifest: what clips
# exist, where they came from, why they're here, and which set each animal gets.
# How to use / extend it: ../SOUNDS.md. Reference numbers: the team's REFERENCES.md.
#
# Originals in originals/ are never processed in place. build_sounds.py makes
# build/<active_profile>/<id>.wav from them; sound_library.py picks clips for a label.

mode: generic                # generic | species | auto
                             #   generic: always the generic set
                             #   species: label_map's set for the label; unknown/missing -> generic
                             #   auto:    same as species (for when the classifier names species)
active_profile: pyle_plmr52  # profiles/<name>.yaml; its WAVs are in build/<name>/

# classifier label -> set. Matching ignores case, spaces, '-' and '_'. Unmapped -> generic.
# Species sets only for the field-tested species (team decision D-20: groundhog, raccoon,
# squirrel); deer, rat and any other label play the generic set.
label_map:
  raccoon: raccoon
  groundhog: groundhog
  woodchuck: groundhog
  squirrel: squirrel
  gray squirrel: squirrel
  eastern gray squirrel: squirrel

# set -> sound types. Clips are picked by sound_type and played round-robin across types.
sets:
  generic:   [human_speech, human_shout, human_scream, dog_bark, siren, bird_synth, raptor, animal_shriek]
                                                   # Nov 10: the generic set is the library;
                                                   # species sets below are kept but unused
  raccoon:   [dog_bark, human_speech, human_shout, human_scream]
  groundhog: [raptor, dog_bark]                    # woodchuck alarm whistles removed 2026-11-05
  squirrel:  [raptor, dog_bark]                    # no human sounds

# Rotation (Nov 10, scare-force scare/sound_library.py TypeBag): the sound type is picked first,
# every type once per round, this many times per round (default 1); then that type's next clip.
type_weights:
  siren: 2
  raptor: 2
  animal_shriek: 1  # Nov 10: lemur + warthog; the lemur alone at 2 came up too often (Nikhil)

# What the cited studies used: sound_type -> SPL at 1 m, references, measurement conditions.
# NOT applied (D-21: all types play at reference_spl_1m_db so TR4 Test 4 holds). Documentation
# of the gap to the literature only; build_sounds.py copies spl_1m_db into report.csv as
# cited_spl_1m_db. Types without an entry have no cited level.
cited_levels:
  dog_bark:
    spl_1m_db: 86
    refs: [51]
    conditions: "86.1 ± 2.9 dB SPL at 1 m, weighting not stated; free-ranging raccoons, BC islands, continuous 20-40% duty cycle"
  human_speech:
    spl_1m_db: 80
    refs: [127, 128]
    conditions: "~80 dB at 1 m, weighting not stated; mesocarnivores (CA) and badgers (UK), 40%/1:1.5 duty cycles"
  raptor:
    spl_1m_db: 78
    refs: [126]
    conditions: "75-80 dB SPL at 1 m (range midpoint), weighting not stated; gray squirrels, 1-3 s red-tailed hawk call"

# One record per clip. evidence: reference numbers; basis: why, where evidence is thin or none.
# flagged: true = left out unless include_flagged=True. excerpt: start/end (s) in the source,
# null = whole source. Excerpts of natural recordings start right at a loud event (cut only, no
# processing), so the onset stays abrupt after the build's lead trim. media_url: the file that
# was downloaded. Team recordings: originals/human_*/team/ (see SOUNDS.md).
# excluded_reason (only when set): the clip is never played. build_sounds.py writes
# "too_peaky: ..." for a clip that would need more limiting than the profile allows even at the
# lowest target, and removes it again once the clip fits; any other reason is set by hand.
# replace_with_team_recording: true = keep playing it, but swap in a team recording when one exists.
